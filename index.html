<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register</title>
<style>
  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --text: #1d2733;
    --muted: #5d6b7a;
    --line: #cdd6df;
    --accent: #1f5fbf;
    --error: #b3261e;
    --ok: #1b7a43;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171d;
      --surface: #1b222b;
      --text: #e8edf2;
      --muted: #9aa7b5;
      --line: #35414f;
      --accent: #6ea4f5;
      --error: #f2918b;
      --ok: #6fcf97;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%;
    max-width: 440px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 32px;
  }
  h1 { margin: 0 0 4px; font-size: 1.5rem; }
  p.sub { margin: 0 0 24px; color: var(--muted); }
  label { display: block; margin-bottom: 6px; font-weight: 600; }
  .field { margin-bottom: 18px; }
  input, textarea {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  textarea { resize: vertical; min-height: 84px; }
  input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 1px;
  }
  .err { color: var(--error); font-size: 0.875rem; margin: 6px 0 0; min-height: 1em; }
  button {
    width: 100%;
    padding: 12px;
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  #status { margin-top: 16px; font-weight: 600; }
  #status.ok { color: var(--ok); }
  #status.fail { color: var(--error); }
</style>
</head>
<body>
<main>
  <h1>Create your registration</h1>
  <p class="sub">All fields are required.</p>

  <form id="form" novalidate>
    <div class="field">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" maxlength="100" autocomplete="name" required>
      <p class="err" data-for="name"></p>
    </div>
    <div class="field">
      <label for="address">Address</label>
      <textarea id="address" name="address" maxlength="255" autocomplete="street-address" required></textarea>
      <p class="err" data-for="address"></p>
    </div>
    <div class="field">
      <label for="birthdate">Birthdate</label>
      <input id="birthdate" name="birthdate" type="date" autocomplete="bday" required>
      <p class="err" data-for="birthdate"></p>
    </div>
    <button type="submit" id="submit">Register</button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
</main>

<script>
  // Paste your Apps Script Web app URL here
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbymp3tj9C58cmWHuNEphXLqCkziudeTJilnWNzSP-1CkLfsBEQNwYaiyJ7f2WyWwtGR3w/exec';

  const form = document.getElementById('form');
  const btn = document.getElementById('submit');
  const status = document.getElementById('status');
  let timer;
  document.getElementById('birthdate').max = new Date().toISOString().split('T')[0];

  // The form posts into a hidden frame; the script replies with postMessage.
  const frame = document.createElement('iframe');
  frame.name = 'result_frame';
  frame.hidden = true;
  document.body.appendChild(frame);
  form.method = 'POST';
  form.action = SCRIPT_URL;
  form.target = 'result_frame';

  function clearErrors() {
    document.querySelectorAll('.err').forEach(el => el.textContent = '');
    status.textContent = '';
    status.className = '';
  }
  function show(msg, cls) {
    status.textContent = msg;
    status.className = cls;
  }

  form.addEventListener('submit', (e) => {
    clearErrors();
    const v = Object.fromEntries(new FormData(form));
    const errs = {};
    if (!v.name.trim()) errs.name = 'Enter your name.';
    if (!v.address.trim()) errs.address = 'Enter your address.';
    const bd = new Date(v.birthdate + 'T00:00:00');
    if (!v.birthdate || isNaN(bd)) errs.birthdate = 'Enter a valid birthdate.';
    else if (bd > new Date()) errs.birthdate = 'Birthdate cannot be in the future.';
    if (Object.keys(errs).length) {
      e.preventDefault();
      for (const [f, msg] of Object.entries(errs)) {
        document.querySelector('.err[data-for="' + f + '"]').textContent = msg;
      }
      return;
    }
    btn.disabled = true;
    timer = setTimeout(() => {
      btn.disabled = false;
      show('Could not reach the server. Check your connection and try again.', 'fail');
    }, 20000);
  });

  window.addEventListener('message', (e) => {
    console.log('message', e.origin, e.data);
    let host = '';
    try { host = new URL(e.origin).hostname; } catch (_) {}
    if (!host.endsWith('.googleusercontent.com')) return;
    clearTimeout(timer);
    btn.disabled = false;
    const data = e.data || {};
    if (data.ok) {
      show('Registered. Thank you!', 'ok');
      form.reset();
    } else if (data.errors) {
      for (const [f, msg] of Object.entries(data.errors)) {
        const el = document.querySelector('.err[data-for="' + f + '"]');
        if (el) el.textContent = msg;
      }
    } else {
      show(data.error || 'Something went wrong.', 'fail');
    }
  });
</script>
</body>
</html>
