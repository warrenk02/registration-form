<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register</title>
<style>
  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --text: #1d2733;
    --muted: #5d6b7a;
    --line: #cdd6df;
    --accent: #1f5fbf;
    --error: #b3261e;
    --ok: #1b7a43;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171d;
      --surface: #1b222b;
      --text: #e8edf2;
      --muted: #9aa7b5;
      --line: #35414f;
      --accent: #6ea4f5;
      --error: #f2918b;
      --ok: #6fcf97;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%;
    max-width: 440px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 32px;
  }
  h1 { margin: 0 0 4px; font-size: 1.5rem; }
  p.sub { margin: 0 0 24px; color: var(--muted); }
  label { display: block; margin-bottom: 6px; font-weight: 600; }
  .field { margin-bottom: 18px; }
  input, textarea {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  textarea { resize: vertical; min-height: 84px; }
  input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 1px;
  }
  .err { color: var(--error); font-size: 0.875rem; margin: 6px 0 0; min-height: 1em; }
  button {
    width: 100%;
    padding: 12px;
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  #status { margin-top: 16px; font-weight: 600; }
  #status.ok { color: var(--ok); }
  #status.fail { color: var(--error); }
</style>
</head>
<body>
<main>
  <h1>Create your registration</h1>
  <p class="sub">All fields are required.</p>

  <form id="form" novalidate>
    <div class="field">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" maxlength="100" autocomplete="name" required>
      <p class="err" data-for="name"></p>
    </div>
    <div class="field">
      <label for="address">Address</label>
      <textarea id="address" name="address" maxlength="255" autocomplete="street-address" required></textarea>
      <p class="err" data-for="address"></p>
    </div>
    <div class="field">
      <label for="birthdate">Birthdate</label>
      <input id="birthdate" name="birthdate" type="date" autocomplete="bday" required>
      <p class="err" data-for="birthdate"></p>
    </div>
    <button type="submit" id="submit">Register</button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
</main>

<script>
  // Paste your Apps Script Web app URL here (see README steps)
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbymp3tj9C58cmWHuNEphXLqCkziudeTJilnWNzSP-1CkLfsBEQNwYaiyJ7f2WyWwtGR3w/exec';

  const form = document.getElementById('form');
  const btn = document.getElementById('submit');
  const status = document.getElementById('status');
  document.getElementById('birthdate').max = new Date().toISOString().split('T')[0];

  function clearErrors() {
    document.querySelectorAll('.err').forEach(el => el.textContent = '');
    status.textContent = '';
    status.className = '';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErrors();
    btn.disabled = true;
    try {
      const res = await fetch(SCRIPT_URL, { method: 'POST', body: new URLSearchParams(new FormData(form)) });
      const data = await res.json();
      if (data.ok) {
        status.textContent = 'Registered. Thank you!';
        status.className = 'ok';
        form.reset();
      } else if (data.errors) {
        for (const [field, msg] of Object.entries(data.errors)) {
          const el = document.querySelector('.err[data-for="' + field + '"]');
          if (el) el.textContent = msg;
        }
      } else {
        status.textContent = data.error || 'Something went wrong.';
        status.className = 'fail';
      }
    } catch (err) {
      status.textContent = 'Could not reach the server. Check your connection and try again.';
      status.className = 'fail';
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
